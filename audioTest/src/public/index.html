<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>audioTest</title>
  <link rel="stylesheet" href="../frontend/style.css" />
</head>
<body>
  <main class="app">
    <input id="audio-file" type="file" accept="audio/*" hidden />
    <div class="upload-row">
      <button id="upload-button" class="upload-button" type="button" aria-label="Upload audio" title="Upload audio">Upload</button>
    </div>

    <section class="player" aria-live="polite">
      <audio id="audio" preload="metadata"></audio>
      <p id="file-name" class="file-name"></p>
      <div class="progress-wrap" role="group" aria-label="Playback progress">
        <div class="progress-track">
          <input id="progress" type="range" min="0" max="1000" value="0" disabled />
          <div id="selected-span-overlay" class="selected-span-overlay" aria-hidden="true"></div>
          <div id="checkpoint-markers" class="checkpoint-markers" aria-hidden="true"></div>
          <div id="playhead" class="playhead" aria-hidden="true">
            <span class="playhead-arrow"></span>
            <span id="playhead-time" class="playhead-time">00:00</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../frontend/app.js"></script>
</body>
</html>
